[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "robo-control"
version = "0.2.0"
description = "Robo vision, differential-drive control, simulator and ESP32-C3 commissioning tools"
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "Robo Team" }]
dependencies = []

[project.optional-dependencies]
vision = ["opencv-contrib-python>=4.10", "numpy>=2.0"]
dev = ["pytest>=8.0"]

[project.scripts]
robo-control = "robo_control.__main__:main"
robo-hardware = "robo_control.hardware:main"
robo-hardware-runtime = "robo_control.hardware_runtime:main"
robo-hardware-calibration = "robo_control.hardware_calibration:main"

[tool.setuptools.packages.find]
include = ["robo_control*"]

[tool.setuptools.package-data]
robo_control = ["data/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
