name: arduino-firmware

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  arduino-ide:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check the committed Arduino sketch matches shared firmware
        run: python tools/sync_arduino_sketch.py --check
      - uses: arduino/setup-arduino-cli@v2
        with:
          version: "1.3.1"
      - uses: actions/cache@v4
        with:
          path: |
            ~/.arduino15
            ~/Arduino/libraries
          key: arduino-esp32-2.0.17-arduinojson-6.21.5-${{ runner.os }}-v1
      - name: Install pinned board support and JSON library
        run: |
          arduino-cli config init --overwrite
          arduino-cli config add board_manager.additional_urls https://espressif.github.io/arduino-esp32/package_esp32_index.json
          arduino-cli core update-index
          arduino-cli core install esp32:esp32@2.0.17
          arduino-cli lib install ArduinoJson@6.21.5
      - name: Compile H1, B1, B2 and B3 using the Arduino IDE sketch
        run: |
          for profile in 1 2 3 4; do
            arduino-cli compile --fqbn esp32:esp32:esp32c3:CDCOnBoot=cdc,FlashMode=dio \
              --build-property "compiler.cpp.extra_flags=-DROBOT_PROFILE=$profile" \
              --build-path "$RUNNER_TEMP/arduino-$profile" arduino/RoboRobot
          done

  platformio:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install platformio==6.1.18
      - uses: actions/cache@v4
        with:
          path: ~/.platformio
          key: pio-esp32-6.9.0-json-6.21.5-${{ runner.os }}-v1
      - name: Build all four physical robot profiles
        run: python -m platformio run --project-dir firmware
      - name: Native safety state machine tests
        run: |
          g++ -std=c++17 -Wall -Wextra -Werror -Ifirmware/include firmware/tests/native/lease_state_test.cpp -o "$RUNNER_TEMP/lease-test"
          "$RUNNER_TEMP/lease-test"
          for profile in 1 2 3 4; do
            for enabled in 0 1; do
              for calibrated in 0 1; do
                g++ -std=c++17 -Wall -Wextra -Werror -Ifirmware/include \
                  -DROBOT_PROFILE=$profile -DHARDWARE_OUTPUT_ENABLED=$enabled \
                  -DACTUATOR_CALIBRATION_CONFIRMED=$calibrated \
                  firmware/tests/native/drive_output_test.cpp -o "$RUNNER_TEMP/drive-test"
                "$RUNNER_TEMP/drive-test"
              done
            done
          done
