name: simulator-ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  vision:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install real-image processing dependencies
        run: python -m pip install -e ".[vision]"
      - name: Verify vision dependencies are available
        run: python -c "import cv2, numpy; print(cv2.__version__, numpy.__version__)"
      - name: Camera, calibration, CLI and regression tests
        run: python -m unittest discover -s tests -v

  web-physics:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Browser simulation geometry and motion tests
        run: node --experimental-strip-types --test web_simulator/tests/*.test.ts

  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Compile
        run: python -m compileall -q robo_control tests tools
      - name: Unit and integration tests
        run: python -m unittest discover -s tests -v
      - name: Headless mission smoke test
        run: python -m robo_control --headless > headless-result.json
      - name: Senior qualifier servo and sensor smoke test
        run: python -m robo_control.qualifier --compact > qualifier-result.json
      - name: Measured-pose mock loop with independent command expiry
        run: python -m robo_control.control_loop --demo --robots 5 --compact

  package-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build wheel and source distribution
        run: |
          python -m pip install build
          python -m build --wheel --sdist --outdir "$RUNNER_TEMP/dist"
      - name: Install and smoke-test wheel outside checkout
        run: |
          python -m venv "$RUNNER_TEMP/wheel-env"
          "$RUNNER_TEMP/wheel-env/bin/python" -m pip install --no-cache-dir --no-deps "$RUNNER_TEMP"/dist/*.whl
          cd "$RUNNER_TEMP"
          "$RUNNER_TEMP/wheel-env/bin/python" -c "from robo_control.config import load_config; from robo_control.simulation import load_scenario; c=load_config(); s=load_scenario(None,c); assert len(s.robots)==c.mission.robot_count==6"
          "$RUNNER_TEMP/wheel-env/bin/robo-control" --headless > "$RUNNER_TEMP/wheel-headless.json"
          "$RUNNER_TEMP/wheel-env/bin/python" -m robo_control.qualifier --compact > "$RUNNER_TEMP/wheel-qualifier.json"
          "$RUNNER_TEMP/wheel-env/bin/python" -m robo_control.control_loop --demo --robots 5 --compact
      - name: Install and smoke-test sdist outside checkout
        run: |
          python -m venv "$RUNNER_TEMP/sdist-env"
          "$RUNNER_TEMP/sdist-env/bin/python" -m pip install --no-cache-dir --no-deps "$RUNNER_TEMP"/dist/*.tar.gz
          cd "$RUNNER_TEMP"
          "$RUNNER_TEMP/sdist-env/bin/python" -c "from robo_control.config import load_config; from robo_control.simulation import load_scenario; c=load_config(); s=load_scenario(None,c); assert len(s.robots)==c.mission.robot_count==6"
          "$RUNNER_TEMP/sdist-env/bin/robo-control" --headless > "$RUNNER_TEMP/sdist-headless.json"
          "$RUNNER_TEMP/sdist-env/bin/python" -m robo_control.qualifier --compact > "$RUNNER_TEMP/sdist-qualifier.json"
          "$RUNNER_TEMP/sdist-env/bin/python" -m robo_control.control_loop --demo --robots 5 --compact

  windows-launcher-smoke:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run Windows launcher headlessly
        shell: cmd
        run: START_SIMULATOR.bat --headless > NUL
