[platformio]
default_envs = H1, B1, B2, B3

[env]
platform = espressif32@6.9.0
board = esp32-c3-devkitm-1
framework = arduino
platform_packages = platformio/framework-arduinoespressif32@3.20017.241212+sha.dcc1105b
lib_deps = bblanchon/ArduinoJson@6.21.5
monitor_speed = 115200
board_build.flash_mode = dio
build_unflags = -std=gnu++11
build_flags =
    -std=gnu++17
    -D ARDUINO_USB_MODE=1
    -D ARDUINO_USB_CDC_ON_BOOT=1
    -D CORE_DEBUG_LEVEL=0

[env:H1]
build_flags = ${env.build_flags} -D ROBOT_PROFILE=1

[env:B3]
build_flags = ${env.build_flags} -D ROBOT_PROFILE=4

; Legacy alias only: H2 is the wire ID of Beaver B3, not a hamster.
[env:H2]
build_flags = ${env.build_flags} -D ROBOT_PROFILE=4

[env:B1]
build_flags = ${env.build_flags} -D ROBOT_PROFILE=2

[env:B2]
build_flags = ${env.build_flags} -D ROBOT_PROFILE=3
